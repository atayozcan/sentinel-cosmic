name: ci

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# Cancel in-flight runs of this workflow when a new commit is pushed
# to the same ref. Keeps PR feedback fast and CI minutes cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Keep the install-path env vars in sync with build.rs defaults so
  # the workspace builds without needing the install.sh wrapper.
  SENTINEL_PREFIX: /usr
  SENTINEL_SYSCONFDIR: /etc
  SENTINEL_LIBEXECDIR: lib
  # Use mold for faster linking. Doesn't change the produced binary
  # (only build-id differs); shaves wall-time off the link step,
  # which fat LTO + codegen-units=1 makes the dominant non-LTO cost.
  # Each job's apt-get installs mold before cargo runs.
  RUSTFLAGS: -C link-arg=-fuse-ld=mold

# Least-privilege default for every job in this workflow. Individual
# jobs that need more (e.g. uploading SARIF, writing artefacts beyond
# the runner's scratch) override this with their own `permissions:`
# block. Scorecard's `actions/missing-workflow-permissions` rule
# expects this at the workflow level.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Format + clippy. Cheap, fail-fast — runs without --release so it picks
  # up test code too.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # The KDE helper needs Qt6/KF6 (not on the Ubuntu runner); it gets
        # its own openSUSE container job below. Exclude it here.
        run: cargo clippy --workspace --exclude sentinel-helper-kde --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests. Runs against stable Rust on Linux. The PAM module is a cdylib
  # so we run `cargo test -p pam-sentinel` separately to exercise its
  # internal unit tests; the rest go through the workspace runner.
  # ---------------------------------------------------------------------------
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace)
        run: cargo test --workspace --exclude sentinel-helper-kde --locked

  # ---------------------------------------------------------------------------
  # Smoke build of the full workspace on both x86_64 and aarch64. The
  # PKGBUILDs claim aarch64 support; this proves it. Free arm64 runners
  # for public repos use ubuntu-24.04-arm.
  # ---------------------------------------------------------------------------
  build:
    name: cargo build (release, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            pkg-config \
            mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release --workspace --exclude sentinel-helper-kde --locked

  # ---------------------------------------------------------------------------
  # Security audit of the dependency tree against the RustSec advisory
  # database. Sentinel sits in the PAM auth path — a known CVE in any
  # transitive dep is something we want failing CI loudly, not waiting
  # for someone to notice.
  # ---------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        # No advisories are ignored. If one needs to be, add it here with
        # a why-comment justifying the accepted risk.
        run: cargo audit --deny warnings

  # ---------------------------------------------------------------------------
  # `cargo deny` — license / source / banned-crate enforcement.
  # Stricter cousin of `cargo audit`: catches a GPL-incompatible license
  # sneaking in through a transitive dep, or a crate hosted somewhere
  # we don't trust. Config lives in `deny.toml` at repo root.
  # ---------------------------------------------------------------------------
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # Agent integration test — drives `session::run` end-to-end through
  # the Allow / Deny / Timeout paths plus cancel-drain, with the helper
  # and polkit-agent-helper-1 short-circuited via env-var test seams.
  # Catches state-machine regressions without needing D-Bus / polkit /
  # a Wayland session in CI.
  # ---------------------------------------------------------------------------
  agent-integration:
    name: agent integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpam0g-dev pkg-config mold

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (agent_flow)
        run: cargo test -p sentinel-polkit-agent --test agent_flow --locked

  # ---------------------------------------------------------------------------
  # REUSE / SPDX compliance. Verifies every file is mapped (either via
  # an inline `SPDX-License-Identifier` header or a `REUSE.toml` glob)
  # to a known license. Together with the per-file headers added in
  # v0.7.0, this catches license drift as contributors add files
  # without the SPDX boilerplate.
  # ---------------------------------------------------------------------------
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: REUSE compliance check
        uses: fsfe/reuse-action@v6

  # ---------------------------------------------------------------------------
  # KDE / Plasma helper (sentinel-helper-kde). Needs Qt6 + KF6 + cxx-qt's
  # transitive private headers — the openSUSE Tumbleweed image ships them
  # without the apt-side KF6 packaging headaches. It's excluded from the
  # Ubuntu workspace jobs above (no Qt there) and built + linted here, in
  # the same container the release workflow uses.
  # ---------------------------------------------------------------------------
  helper-kde:
    name: build helper (Qt6 / KF6)
    runs-on: ubuntu-latest
    container: registry.opensuse.org/opensuse/tumbleweed:latest
    # cxx-qt-build 0.9 no longer auto-discovers Qt on openSUSE — point it at
    # the system qmake6 (qt6-base-devel installs it here) or the build script
    # panics with "Could not find Qt".
    env:
      QMAKE: /usr/bin/qmake6
    steps:
      - name: Install toolchain + Qt/KF6 deps
        # mold too, to satisfy the workflow-level RUSTFLAGS link-arg.
        run: >
          zypper -n install --no-recommends git tar gzip gcc gcc-c++ make mold
          rust cargo pam-devel
          qt6-base-devel qt6-base-private-devel
          qt6-declarative-devel qt6-declarative-private-devel
          kf6-kirigami-imports kf6-qqc2-desktop-style
          layer-shell-qt6-imports kf6-breeze-icons qt6-wayland

      - uses: actions/checkout@v7

      - name: Mark workspace safe for git
        # The container mounts the workspace with a different owner; git
        # bails on "dubious ownership" without this opt-in.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: cargo clippy (kde helper)
        run: cargo clippy -p sentinel-helper-kde --all-targets -- -D warnings

      - name: cargo build (kde helper, release)
        run: cargo build --release -p sentinel-helper-kde --locked
